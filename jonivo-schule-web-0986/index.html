<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183A63">
<meta name="description" content="JONIVO Schule – lokale Web/PWA-Arbeitsoberfläche">
<link rel="manifest" href="./manifest.webmanifest">
<title>JONIVO Schule</title>
<style>
:root{--navy:#183A63;--blue:#276DB6;--bg:#f5f7fb;--card:#fff;--text:#172335;--muted:#68788e;--line:#dce3ee;--ok:#1c7c54;--error:#b42318;--accent:#eaf3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}header{min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:white;box-shadow:0 2px 10px #0002}
h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.82}.brandmark{font-size:28px}.spacer{flex:1}.user{font-size:14px}.ghost{border:1px solid #ffffff55;background:#ffffff10;color:#fff;border-radius:11px;padding:8px 11px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:10px 16px;background:white;border-bottom:1px solid var(--line);overflow:auto;position:sticky;top:0;z-index:3}
.tabs button{border:0;background:#eef2f7;color:#38506d;padding:9px 13px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap}.tabs button.active{background:var(--navy);color:#fff}
main{max-width:1120px;margin:0 auto;padding:24px 18px 42px}.panel,.hero,.card,.rowcard{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 3px 14px #15233a0b}
.panel{padding:22px}.panel.narrow{max-width:560px;margin:36px auto}.hero{padding:22px;display:flex;gap:16px;align-items:flex-start;background:linear-gradient(135deg,#fff,#eef5ff)}.heroicon{font-size:36px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h2{font-size:29px;margin:4px 0 10px}h3{margin:8px 0 10px}.muted,p{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px}.card{padding:18px;min-height:140px}.big{font-size:30px}.card h3{color:var(--text)}
.form{display:grid;gap:13px}.gridform{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.form label{display:grid;gap:6px;font-weight:700;color:#344760}.form input,.form select,.toolbar input{width:100%;padding:11px 12px;border:1px solid #cfd8e5;border-radius:11px;background:white;color:var(--text)}
.primary,.secondary,.filebutton{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white}.secondary,.filebutton{background:#edf3fa;color:#24415f;border:1px solid #d4dfeb}.filebutton{display:inline-flex;align-items:center}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}.list{display:grid;gap:10px;margin-top:12px}.rowcard{padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.rowcard p{margin:7px 0 0}.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.dbnote{margin-top:18px;background:#f1f5fa;border:1px solid var(--line);border-radius:12px;padding:13px;color:#52667f}
.message{margin-bottom:14px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:#fff}.message.ok{border-color:#b7dfce;background:#effaf5;color:var(--ok)}.message.error{border-color:#f0c7c4;background:#fff4f2;color:var(--error)}
@media(max-width:620px){header{align-items:flex-start;flex-wrap:wrap}.user{width:100%;order:5}.panel{padding:17px}main{padding:16px 12px 30px}.hero{padding:17px}.rowcard{align-items:flex-start;flex-direction:column}.gridform{grid-template-columns:1fr}}
details{margin:8px 0}.subpanel{background:#f8fbff;border:1px solid var(--line);border-radius:14px;padding:14px}summary{cursor:pointer;color:#284c74;margin-bottom:12px}.form textarea,#authoringEditor textarea,#authoringEditor input,#authoringEditor select,#entrySelect{width:100%;padding:11px 12px;border:1px solid #cfd8e5;border-radius:11px;background:white;color:var(--text);font:inherit}.span2{grid-column:1/-1}.reviewcheck{display:flex!important;grid-template-columns:auto 1fr!important;align-items:flex-start;gap:10px!important;margin:14px 0}.reviewcheck input{width:auto!important;margin-top:4px}#authoringEditor label{display:grid;gap:6px;margin-top:12px;font-weight:700;color:#344760}
 .schoolchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf3fa;border:1px solid #d5e0ec;color:#36516e;font-size:13px;font-weight:700}progress{width:100%;height:18px;margin-top:14px}
.chip[data-state="running"]{background:#fff7df;border-color:#efd58c}.chip[data-state="done"]{background:#edf9f2;border-color:#b8dfc7}.chip[data-state="skipped"]{background:#fff1ef;border-color:#efc4be}
</style>
</head>
<body>
<div id="app"><main><div class="panel">JONIVO Schule wird geladen …</div></main></div>
<script src="./data.js"></script>
<script src="./app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
